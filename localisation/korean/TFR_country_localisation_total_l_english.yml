# Introduction

# Characters
HALLOWEEN_Mecha_Hitler_char: "Adolf Hitler"
HALLOWEEN_Mecha_Hitler_char_desc: "When the Russian President died, Russia quietly began an aggressive expansion. Although everyone hoped for victory, the Russian bear managed to surpass our European might. As expected, our power was undermined, and right-wingers began to rule the country. Frank Franz decided to end the communist threat once and for all, and to do so, he forced millions of scientists to create Project Vengeance. It was the most ambitious and insane plan in human history. The project entailed the creation of an artificial Adolf Hitler—not just a digital copy, but a synthesized mind, absorbing all the will, genius, and obsession of the Führer. This new, ideal leader, devoid of the mistakes of the past, was to lead the Greater German Reich to §RGERMAN HEGEMONY ACROSS THE WORLD§!"

