#HALLOWEEN_big_scary_debuff: "Great Blackout"
#HALLOWEEN_big_scary_debuff_desc: "The dead of night is the most fertile breeding ground for fear and cowardice, for darkness remains the most primal, profound, and ancient terror carved into the heart of every human. Yet, ever since electricity began to flow across the world, becoming the lifeblood of human society, light has become the dominant melody of civilization. Humanity conquered darkness with its own hands, and seemed to forget the era when shadows ruled, ravaged, and trampled us underfoot.\n\nThus did the Nazis-eternal companions of terror-administer their harsh lesson to those who had lost their fundamental reverence for the dark. The Great Blackout swept across Europe alongside the Nazis returning from the Moon, dragging Europeans immersed in luminous dreams back into the bottomless abyss called darkness.\n\nFactories stalled, construction ceased, technological progress stagnated, as if a giant hand had clenched Europe's heart. Stripped of electricity, the continent seemed to gasp for breath, nearing suffocation.\n\nIn the darkness, what people lost first wasn't material possessions, but security: resource distribution grew strained, failing public services spread panic, and trust between individuals faced ultimate tests. Not everyone would break, but collective fragility inevitably surfaced. Civilization's veneer cracked under pressure, forcing everyday rules into retreat.\n\nYet this darkness wasn't entirely malignant, at least it could still offer some protection. So warn everyone you know: light no candles, covet not those feeble glimmers. Otherwise, you'll witness your own death unfolding, perish in endless agony; you'll behold this world's most despairing spectacle-the century-old specter lifting its iron hoof once more-\n\n-to crush your final shred of hope."
