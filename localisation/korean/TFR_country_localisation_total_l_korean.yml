GER_hitler_idea: "§R로보-히틀러§!"
#HALLOWEEN_big_scary_debuff: "대정전"
#HALLOWEEN_big_scary_debuff_desc: "한밤중의 어둠은 공포와 비겁함이 가장 번성하기 좋은 환경입니다. 어둠은 모든 인간의 마음속에 새겨진 가장 원초적이고 심오하며 오래된 공포이기 때문입니다. 그러나 전기가 세계 곳곳으로 흐르기 시작하고 인간 사회의 생명줄이 된 이래, 빛은 문명의 지배적인 선율이 되었습니다. 인류는 자신의 손으로 어둠을 정복했고, 그림자가 우리를 지배하고 유린하며 짓밟던 시대를 잊은 듯했습니다.\n\n그리하여 공포의 영원한 동반자인 나치는 어둠에 대한 근본적인 경외심을 잃어버린 자들에게 가혹한 교훈을 안겨주었습니다. 달에서 돌아온 나치들과 함께 대정전은 유럽 전역을 휩쓸었고, 빛나는 꿈에 빠져 있던 유럽인들을 어둠이라는 끝없는 심연으로 끌어내렸습니다.\n\n공장들은 멈추고 건설은 중단되었으며 기술 발전은 정체되었습니다. 마치 거대한 손이 유럽의 심장을 움켜쥔 것 같았습니다. 전기를 빼앗긴 대륙은 질식 직전의 숨을 헐떡이는 듯했습니다.\n\n어둠 속에서 사람들이 가장 먼저 잃은 것은 물질적 소유물이 아니라 안전이었습니다. 자원 분배는 어려워졌고, 제대로 작동하지 않는 공공 서비스는 공포를 퍼뜨렸으며, 사람들 사이의 신뢰는 극한의 시험대에 올랐습니다. 모두가 무너지는 것은 아니었지만, 집단적인 취약성은 필연적으로 드러났습니다. 문명의 겉모습은 압박 속에서 갈라졌고, 일상의 규칙은 뒤로 밀려났습니다.\n\n그러나 이 어둠이 완전히 악의적인 것만은 아니었습니다. 적어도 어느 정도의 보호를 제공할 수는 있었습니다. 그러니 아는 모든 이에게 경고하십시오. 촛불을 켜지도 말고, 그 희미한 빛을 탐내지도 마십시오. 그렇지 않으면 자신의 죽음이 펼쳐지는 것을 목격하고 끝없는 고통 속에서 사라지게 될 것입니다. 이 세상에서 가장 절망적인 광경을 보게 될 것입니다. 백 년 된 망령이 다시 한번 철제 발굽을 들어 올리는 모습을—\n\n—당신의 마지막 희망의 조각마저 짓밟는 모습을."
