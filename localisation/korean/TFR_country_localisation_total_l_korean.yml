# Introduction

# Characters
HALLOWEEN_Mecha_Hitler_char: "아돌프 히틀러"
HALLOWEEN_Mecha_Hitler_char_desc: "러시아 대통령이 사망하자 러시아는 조용히 공격적인 팽창을 시작했습니다. 모두가 승리를 바랐지만, 러시아의 곰은 결국 우리의 유럽 군사력을 뛰어넘었습니다. 예상대로 우리의 국력은 약화되었고, 우익 세력이 국가를 통치하기 시작했습니다. 프랭크 프란츠는 공산주의의 위협을 단번에 끝내기로 결심했고, 이를 위해 수백만 명의 과학자들에게 복수 프로젝트를 만들도록 강요했습니다. 그것은 인류 역사상 가장 야심차고 광기 어린 계획이었습니다. 이 프로젝트는 인공적인 아돌프 히틀러를 만들어내는 것이었습니다. 단순한 디지털 복제품이 아니라, 총통의 모든 의지와 천재성, 집착을 흡수한 합성 정신이었습니다. 과거의 실수를 없앤 이 새로운 이상적인 지도자는 대게르만 제국을 §R세계 전역의 독일 패권§!으로 이끌 예정이었습니다."

